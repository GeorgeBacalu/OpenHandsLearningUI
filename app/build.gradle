import groovy.json.JsonOutput

plugins {
    alias(libs.plugins.android.application)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

def localConfiguration = new Properties()
def localConfigurationFile = rootProject.file('local.properties')
if (localConfigurationFile.exists()) {
    localConfigurationFile.withInputStream { localConfiguration.load(it) }
}
def apiBaseUrl = providers.gradleProperty('apiBaseUrl')
        .orElse(localConfiguration.getProperty('apiBaseUrl', 'http://10.0.2.2:8080/')).get()
def releaseApiBaseUrl = providers.gradleProperty('releaseApiBaseUrl')
        .orElse(providers.environmentVariable('OHL_RELEASE_API_BASE_URL'))
        .orElse(localConfiguration.getProperty('releaseApiBaseUrl', '')).get()
def releaseMediaBaseUrl = providers.gradleProperty('releaseMediaBaseUrl')
        .orElse(providers.environmentVariable('OHL_RELEASE_MEDIA_BASE_URL'))
        .orElse(localConfiguration.getProperty('releaseMediaBaseUrl', '')).get()

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('signing.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def signingValues = [
        storeFile: providers.environmentVariable('OHL_KEYSTORE_FILE').orElse(releaseSigning.getProperty('storeFile', '')).get(),
        storePassword: providers.environmentVariable('OHL_KEYSTORE_PASSWORD').orElse(releaseSigning.getProperty('storePassword', '')).get(),
        keyAlias: providers.environmentVariable('OHL_KEY_ALIAS').orElse(releaseSigning.getProperty('keyAlias', '')).get(),
        keyPassword: providers.environmentVariable('OHL_KEY_PASSWORD').orElse(releaseSigning.getProperty('keyPassword', '')).get()
]
def missingSigningValues = signingValues.findAll { key, value -> value.isBlank() }.keySet().toList()
def releaseKeyStore = signingValues.storeFile.isBlank() ? null : rootProject.file(signingValues.storeFile)

def verifyReleaseConfiguration = tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Checks the HTTPS backend and signing configuration before distributing an APK or app bundle.'
    inputs.property('releaseApiBaseUrl', releaseApiBaseUrl)
    inputs.property('releaseMediaBaseUrl', releaseMediaBaseUrl)
    inputs.property('missingSigningValues', missingSigningValues)
    inputs.property('keyStoreExists', releaseKeyStore != null && releaseKeyStore.isFile())
    doLast {
        for (String setting : ['releaseApiBaseUrl', 'releaseMediaBaseUrl']) {
            def endpoint
            try {
                endpoint = new URI(inputs.properties[setting])
            } catch (URISyntaxException ignored) {
                throw new GradleException(setting + ' must be a valid HTTPS URL ending in /.')
            }
            def host = endpoint.host?.toLowerCase(Locale.ROOT)
            if (endpoint.scheme != 'https' || !host || !host.contains('.') ||
                    host == 'localhost' || host.endsWith('.localhost') || host.endsWith('.local') ||
                    host ==~ /[0-9.]+/ || endpoint.userInfo != null || endpoint.query != null ||
                    endpoint.fragment != null || !endpoint.path.endsWith('/')) {
                throw new GradleException('Set ' + setting + ' to the deployed HTTPS URL ending in /. Local development URLs cannot be distributed.')
            }
        }
        if (!inputs.properties.missingSigningValues.isEmpty() || !inputs.properties.keyStoreExists) {
            throw new GradleException('Configure your release keystore in signing.properties or OHL_KEYSTORE_* / OHL_KEY_* environment variables. See DISTRIBUTION.md.')
        }
    }
}
android {
    namespace = 'com.project.ohl'
    compileSdk {
        version = release(libs.versions.compileSdk.get().toInteger()) {
            minorApiLevel = libs.versions.compileSdkMinor.get().toInteger()
        }
    }
    buildToolsVersion = libs.versions.buildTools.get()

    defaultConfig {
        applicationId = 'com.project.ohl'
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.compileSdk.get().toInteger()
        versionCode = 3
        versionName = '1.0.2'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', JsonOutput.toJson(apiBaseUrl)
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'MEDIA_BASE_URL', JsonOutput.toJson(
                    'https://open-hands-learning.s3.us-east-1.amazonaws.com/')
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', JsonOutput.toJson(releaseApiBaseUrl)
            buildConfigField 'String', 'MEDIA_BASE_URL', JsonOutput.toJson(releaseMediaBaseUrl)
        }
    }

    if (missingSigningValues.isEmpty()) {
        signingConfigs {
            distribution {
                storeFile = releaseKeyStore
                storePassword = signingValues.storePassword
                keyAlias = signingValues.keyAlias
                keyPassword = signingValues.keyPassword
            }
        }
        buildTypes.release.signingConfig = signingConfigs.distribution
    }

    lint {
        warningsAsErrors = true
    }

}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn verifyReleaseConfiguration
    }
}

dependencies {
    compileOnly libs.jspecify
    coreLibraryDesugaring libs.desugar
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.okhttp
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.recyclerview
    implementation libs.material
    implementation libs.kotlin.stdlib
    implementation libs.glide
    implementation libs.gson
    implementation libs.retrofit
    implementation libs.retrofit.gson

    testImplementation libs.archunit
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
