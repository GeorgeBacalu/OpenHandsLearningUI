plugins {
    id 'com.android.application'
}

android {
    namespace = "com.example.llt_project_separate"
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.example.llt_project_separate"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    viewBinding {
        enabled = true
    }

    buildFeatures {
        buildConfig = true
    }

    def apiBaseUrl = project.findProperty('apiBaseUrl') ?: 'http://10.0.2.2:8080/'
    defaultConfig.buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl + '"'

    lint {
        abortOnError = false
    }
    buildToolsVersion '37.0.0'
}

dependencies {
    // AndroidX and Material Design
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Kotlin and core utilities
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'

    // Navigation components
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.15.0'

    // Lottie for animations
    implementation 'com.airbnb.android:lottie:6.7.1'

    // Additional libraries

    // Retrofit for networking
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Liquid Swipe
    // implementation 'com.cuberto:liquid-swipe:1.0.0'
    // implementation 'com.github.Chrisvin:LiquidSwipe:1.3'

    // Exclude conflicting Kotlin modules
    configurations.configureEach {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }
}
