plugins {
    alias(libs.plugins.room)
    alias(libs.plugins.android.application)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

def apiBaseUrl = providers.gradleProperty('apiBaseUrl').orElse('http://10.0.2.2:8080/').get()

android {
    namespace = 'com.project.ohl'
    compileSdk {
        version = release(libs.versions.compileSdk.get().toInteger()) {
            minorApiLevel = libs.versions.compileSdkMinor.get().toInteger()
        }
    }
    buildToolsVersion = libs.versions.buildTools.get()

    defaultConfig {
        applicationId = 'com.project.ohl'
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.compileSdk.get().toInteger()
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(apiBaseUrl)
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    lint {
        warningsAsErrors = true
    }

}

room {
    schemaDirectory "$projectDir/schemas"
}

dependencies {
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    coreLibraryDesugaring libs.desugar
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.okhttp
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.viewpager2
    implementation libs.material
    implementation libs.kotlin.stdlib
    implementation libs.glide
    implementation libs.gson
    implementation libs.lottie
    implementation libs.retrofit
    implementation libs.retrofit.gson

    testImplementation libs.archunit
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
